version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleursdelilas_db
    environment:
      POSTGRES_USER: fleursdelilas_user
      POSTGRES_PASSWORD: fleursdelilas_password
      POSTGRES_DB: FleursDeLilasDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database:/docker-entrypoint-initdb.d
    restart: always

volumes:
  postgres_data: